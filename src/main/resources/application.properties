spring.application.name=gather
server.port=${PORT:8000}
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:verityscout;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
verityscout.geocoding.base-url=${GEOCODING_BASE_URL:https://nominatim.openstreetmap.org}
verityscout.discovery.overpass-urls=${OVERPASS_URLS:https://overpass.private.coffee/api/interpreter,https://overpass-api.de/api/interpreter,https://maps.mail.ru/osm/tools/overpass/api/interpreter}
verityscout.search.photon-base-url=${PHOTON_BASE_URL:https://photon.komoot.io}
